name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run backend tests
        working-directory: backend/Almacen-Datos
        run: mvn -B clean test

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-reports
          path: backend/Almacen-Datos/target/surefire-reports/**/*.xml

  frontend:
    name: Frontend (Vite + Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/almacen-de-datos/package-lock.json

      - name: Install dependencies
        working-directory: frontend/almacen-de-datos
        run: npm install --no-fund --no-audit

      - name: Run unit tests with coverage
        working-directory: frontend/almacen-de-datos
        run: npm test

      - name: Build frontend
        working-directory: frontend/almacen-de-datos
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/almacen-de-datos/coverage

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download backend JUnit reports
        uses: actions/download-artifact@v4
        with:
          name: backend-junit-reports
          path: backend/Almacen-Datos/target/surefire-reports

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/almacen-de-datos/coverage

      - name: Build backend bytecode for Sonar
        working-directory: backend/Almacen-Datos
        run: mvn -B -DskipTests package

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >-
            -Dsonar.projectKey=REPLACE_WITH_PROJECT_KEY
            -Dsonar.projectName=AlmacenDeDatos
            -Dsonar.sources=backend/Almacen-Datos/src/main/java,frontend/almacen-de-datos/src
            -Dsonar.tests=backend/Almacen-Datos/src/test/java,frontend/almacen-de-datos/src
            -Dsonar.junit.reportPaths=backend/Almacen-Datos/target/surefire-reports
            -Dsonar.javascript.lcov.reportPaths=frontend/almacen-de-datos/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,backend/Almacen-Datos/target/**
            -Dsonar.coverage.exclusions=**/*.spec.ts,**/__tests__/**

      - name: Upload Sonar logs (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-logs
          path: .scannerwork
